# Her gönderimde siteyi derleyip GitHub Pages'e yayımlar.
name: Yayın

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Harita bölgeleri ayda bir yeni OpenStreetMap verisiyle yenilenir
  schedule:
    - cron: '0 3 1 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Çevrimdışı harita bölgeleri (haritalar/bolgeler.json): Protomaps günlük derlemesinden çıkarılır
      - name: Harita bölgeleri
        run: node scripts/make-regions.mjs dist
        continue-on-error: true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
